# DataWind + DolphinScheduler 元数据采集 Recipe
# 使用方式: datahub ingest -c datawind_dolphinscheduler_recipe.yml

# ==================== DataWind 采集 ====================
source:
  type: "datawind"
  config:
    # DataWind OpenAPI 地址 (火山引擎)
    api_base: "https://console.volcengine.com/bi/datawind/aeolus"
    region: "cn-beijing"

    # 应用凭证
    app_id: 20074764
    client_id: "c28c6f2a46766522edab67732e7c1cdf"
    client_secret: "16vsL5vmVEO0yvxr"
    proxy_user: "liyunze@2105712913"

    # 可选配置
    request_timeout_sec: 180
    max_workers: 8
    extract_dim_metrics: true

    # 状态化采集
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true

# ==================== Sink: 本地 DataHub ====================
sink:
  type: "datahub-rest"
  config:
    server: "http://localhost:8080"

