# DolphinScheduler 元数据采集 Recipe
# 使用方式: datahub ingest -c dolphinscheduler_recipe.yml

source:
  type: "dolphinscheduler"
  config:
    # DolphinScheduler REST API 地址
    api_url: "http://192.168.2.15:12345/dolphinscheduler"

    # API 令牌
    token: "25d8cca5b5baa051a9ccadd2e833ba92"

    request_timeout_sec: 20
    extract_task_sql_lineage: true

    # 状态化采集
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true

sink:
  type: "datahub-rest"
  config:
    server: "http://localhost:8080"
